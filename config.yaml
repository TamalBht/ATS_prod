# Adaptive Resume ATS Scorer Configuration


project:
  name: "Adaptive Resume ATS Scorer"
  version: "0.3.0"
  phase: 2
  

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  console_enabled: true
  log_file: "data/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

paths:
  data_root: "data"
  input_dir: "data/input"
  output_dir: "data/output"
  logs_dir: "data/logs"
  sample_resumes_dir: "data/sample_resumes"
  roles_dir: "data/roles"


  
parser:
  supported_formats: [".pdf", ".docx"]
  max_file_size_mb: 10
  timeout_seconds: 30

environment:
  python_version: "3.9+"
  encoding: "utf-8"
  timezone: "UTC"

scoring:
  # Maximum scores for each category
  max_scores:
    section_completeness: 40
    content_quality: 30
    contact_information: 20
    structure_organization: 10
  
  # Section importance weights (used in section scoring)
  section_weights:
    summary: 0.15
    experience: 0.30
    education: 0.20
    skills: 0.20
    projects: 0.10
    certifications: 0.05
  
  # Minimum content lengths (characters)
  min_content_length:
    summary: 100
    experience: 200
    education: 50
    skills: 50
    projects: 100
  
  # Contact scoring
  contact_scores:
    email: 10  # Required
    phone: 5
    linkedin: 3
    github: 2
  
  # Keyword categories for baseline scoring
  essential_keywords:
    technical: ["software", "developer", "engineer", "programming", "technical"]
    experience: ["years", "experience", "led", "developed", "managed", "built"]
    education: ["degree", "university", "bachelor", "master", "certification"]
  
  # Penalties
  penalties:
    missing_required_section: 10
    too_short_content: 5
    no_contact_info: 15
    no_quantifiable_achievements: 5
  
  # Bonuses
  bonuses:
    has_github: 2
    has_certifications: 3
    quantifiable_achievements: 5
    multiple_projects: 3

roles:
  # Role detection settings
  detection:
    min_confidence: 0.3  # Minimum confidence to assign a role
    use_skills: true
    use_experience: true
    use_keywords: true
  
  # Default role (used when no specific role detected)
  default_role: "general"
  
  # Role matching weights
  matching_weights:
    skills: 0.6
    keywords: 0.3
    experience: 0.1

nlp:
  # Enable/disable NLP features
  enabled: true
  
  # TF-IDF settings
  tfidf:
    max_features: 500
    ngram_range: [1, 3]  # unigrams, bigrams, trigrams
    min_df: 1
    max_df: 0.95
  
  # Semantic similarity settings
  semantic:
    enabled: false  # Set to true if spaCy installed
    similarity_threshold: 0.6  # 0-1, higher = stricter matching
    model: "en_core_web_sm"
  
  # Keyword quality thresholds
  keyword_quality:
    min_density: 0.5   # Min keywords per 100 words
    max_density: 20.0   # Max keywords per 100 words (stuffing threshold)
    optimal_density: 10.0  # Optimal keywords per 100 words
  
  # N-gram extraction
  ngrams:
    min_length: 2
    max_length: 3
    min_frequency: 1

# Future phase configurations
