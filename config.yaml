# Adaptive Resume ATS Scorer Configuration


project:
  name: "Adaptive Resume ATS Scorer"
  version: "0.3.0"
  phase: 2
  

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  console_enabled: true
  log_file: "data/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

paths:
  data_root: "data"
  input_dir: "data/input"
  output_dir: "data/output"
  logs_dir: "data/logs"
  sample_resumes_dir: "data/sample_resumes"

  
parser:
  supported_formats: [".pdf", ".docx"]
  max_file_size_mb: 10
  timeout_seconds: 30

environment:
  python_version: "3.9+"
  encoding: "utf-8"
  timezone: "UTC"

scoring:
  # Maximum scores for each category
  max_scores:
    section_completeness: 40
    content_quality: 30
    contact_information: 20
    structure_organization: 10
  
  # Section importance weights (used in section scoring)
  section_weights:
    summary: 0.15
    experience: 0.30
    education: 0.20
    skills: 0.20
    projects: 0.10
    certifications: 0.05
  
  # Minimum content lengths (characters)
  min_content_length:
    summary: 100
    experience: 200
    education: 50
    skills: 50
    projects: 100
  
  # Contact scoring
  contact_scores:
    email: 10  # Required
    phone: 5
    linkedin: 3
    github: 2
  
  # Keyword categories for baseline scoring
  essential_keywords:
    technical: ["software", "developer", "engineer", "programming", "technical"]
    experience: ["years", "experience", "led", "developed", "managed", "built"]
    education: ["degree", "university", "bachelor", "master", "certification"]
  
  # Penalties
  penalties:
    missing_required_section: 10
    too_short_content: 5
    no_contact_info: 15
    no_quantifiable_achievements: 5
  
  # Bonuses
  bonuses:
    has_github: 2
    has_certifications: 3
    quantifiable_achievements: 5
    multiple_projects: 3
