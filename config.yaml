# Adaptive Resume ATS Scorer Configuration


project:
  name: "Adaptive Resume ATS Scorer"
  version: "0.1.0"
  phase: 1
  description: "Resume Parsing & Structure Detection"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  console_enabled: true
  log_file: "data/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

paths:
  data_root: "data"
  input_dir: "data/input"
  output_dir: "data/output"
  logs_dir: "data/logs"
  sample_resumes_dir: "data/sample_resumes"

  
parser:
  supported_formats: [".pdf", ".docx"]
  max_file_size_mb: 10
  timeout_seconds: 30

environment:
  python_version: "3.9+"
  encoding: "utf-8"
  timezone: "UTC"

